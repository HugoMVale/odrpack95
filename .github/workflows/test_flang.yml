name: Build and test pkg with Flang

on: [push, pull_request, workflow_dispatch]

jobs:

  # Quick test in Ubuntu
  test_quick:
    runs-on: ubuntu-latest
    steps:
    
      - name: Set up Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: flang
          platform: ubuntu-latest
          extra-packages: "openblas"
      
      - name: Test debug
        run: |
          fpm test --profile debug --compiler flang-new
        
  # Matrix test 
  test_matrix:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.compiler-version }}
    runs-on: ${{ matrix.os }}
    needs: test_quick
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [flang]
        compiler-version: ["21"]
        include:
          - os: ubuntu-latest
            extra-packages: "openblas"
          - os: windows-latest
            extra-packages: "openblas pkg-config"
                
    steps:
      - name: Set up Fortran
        uses: gha3mi/setup-fortran-conda@latest
        with:
          compiler: ${{ matrix.compiler }}
          compiler-version: ${{ matrix.compiler-version }}
          platform: ${{ matrix.os }}
          extra-packages: ${{ matrix.extra-packages }}

      - name: Test Debug
        run: |
          fpm test --profile debug --compiler flang-new

